name: Release

# Publishes to crates.io whenever a GitHub release is published.
# Auth: CARGO_REGISTRY_TOKEN repo secret (scoped to `tonggeret` only).
# The tag MUST match the package version (vX.Y.Z == version X.Y.Z);
# the guard step fails the run otherwise. Re-running is safe:
# crates.io rejects already-published versions, so a retry fails closed.

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Guard — release tag matches Cargo.toml version
        run: |
          pkg_version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "tonggeret") | .version')
          test "v$pkg_version" = "$GITHUB_REF_NAME" \
            || { echo "tag $GITHUB_REF_NAME != package v$pkg_version"; exit 1; }
      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
